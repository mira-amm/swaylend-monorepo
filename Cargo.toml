[workspace]
members = [
    # Contracts (types)
    "contracts/market",
    "contracts/src-20",
    "contracts/pyth-mock",
    "contracts/token",
    # Libs
    "libs/market_sdk",
    "libs/token_sdk",
    "libs/pyth_mock_sdk",
    # Scripts
    "scripts",
]
resolver = "2"

[workspace.package]
rust-version = "1.79.0"

[workspace.dependencies]
# Local SDKs
market_sdk = { path = "libs/market_sdk" }
token_sdk = { path = "libs/token_sdk" }
pyth_mock_sdk = { path = "libs/pyth_mock_sdk" }

# Local contracts (types)
pyth_mock = { path = "contracts/pyth-mock" }
market = { path = "contracts/market" }
token = { path = "contracts/token" }

# External
pyth_sdk = { git = "https://github.com/pyth-network/pyth-crosschain", rev = "7de4ce3ec8defd97641c1d25302abe117bf5092b" }
tokio = { version = "1.12", features = ["full"] }
fuels = { version = "0.66.9", features = ["fuel-core-lib"] }
dotenv = "0.15.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
reqwest = "0.11.20"
rand = "0.8.5"
chrono = "0.4.38"
anyhow = "1.0.86"
tai64 = "4.0.0"
clap = { version = "4.5.17", features = ["env", "derive"] }
hex = "0.4.3"
